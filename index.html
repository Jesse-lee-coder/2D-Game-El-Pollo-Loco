<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/menu.css" />
    <link rel="stylesheet" href="styles/play-game.css" />

    <link rel="icon" href="icons/favicon.png" type="image/x-icon" />
</head>

<body class="body-index">
    <div class="overlay-rotate-device" id="overlay_rotate_device">
        <img src="icons/rotate-device.png" alt="rotate phone icon" />
    </div>

    <div class="start-screen" id="start_screen">
        <img
            class="start-screen-background"
            src="img/img/9_intro_outro_screens/Background.png"
            alt="Background Image"
        />
        <div class="start-container">
            <img
                src="img/img/9_intro_outro_screens/start/startscreen_1.png"
                alt="Start Screen"
            />
            <nav class="start-nav">
                <button
                    title="Menu"
                    class="btn-desktop"
                    onclick="showScreen('menu')"
                >
                    Menu
                </button>
                <button
                    title="Imprint"
                    class="btn-desktop"
                    onclick="navigateTo('imprint.html')"
                >
                    Imprint
                </button>
            </nav>
        </div>
    </div>

    <div class="menu-screen d-none" id="menu_screen">
        <img
            class="menu-screen-background"
            src="img/img/9_intro_outro_screens/Background.png"
            alt="Background image"
        />

        <div class="menu-container">
            <nav class="menu-nav">
                <button
                    id="start_game_btn"
                    title="Start Game"
                    class="btn-desktop"
                    onclick="showScreen('game')"
                >
                    Start Game
                </button>
                <button
                    title="Start Screen"
                    class="btn-desktop"
                    onclick="showScreen('start')"
                >
                    Back to Start
                </button>
            </nav>

            <div class="menu-main">
                <div class="content-desktop">
                    <h2>Game Controls</h2>
                    <div class="controls-box">
                        <div class="control-left">
                            <img src="icons/left-arrow.png" alt="left arrow icon" />
                            <p>Move left</p>
                        </div>
                        <div class="control-right">
                            <img src="icons/right-arrow.png" alt="right arrow icon" />
                            <p>Move right</p>
                        </div>
                        <div class="control-throw">
                            <img src="icons/button-d.png" alt="D icon" />
                            <p>Throw bottle</p>
                        </div>
                        <div class="control-jump">
                            <img src="icons/button-space.png" alt="space icon" />
                            <p>Jump</p>
                        </div>
                    </div>
                </div>

                <div class="content-mobile">
                    <h2>Game Controls</h2>
                    <div class="controls-box">
                        <div class="control-left-mobile">
                            <img src="icons/left-arrow.png" alt="left arrow icon" />
                            <p>Move left</p>
                        </div>
                        <div class="control-right-mobile">
                            <img src="icons/right-arrow.png" alt="right arrow icon" />
                            <p>Move right</p>
                        </div>
                        <div class="control-jump-mobile">
                            <img src="icons/jump-icon.png" alt="jump icon" />
                            <p>Jump</p>
                        </div>
                        <div class="control-throw-mobile">
                            <img src="icons/throw-icon.png" alt="throw icon" />
                            <p>Throw bottle</p>
                        </div>
                    </div>
                </div>

                <h2>How to Play</h2>
                <div class="game-instructions">
                    <p>
                        <b>Defeating Enemies:</b> Jump on top of an enemy to defeat them.
                    </p>
                    <p>
                        <b>Final Boss:</b> Hit him with bottles or jump on him.
                    </p>
                </div>
            </div> 
        </div> 
    </div> 

    <div class="game-wrapper d-none" id="game_screen">
        <img
            class="game-screen-background"
            src="img/img/9_intro_outro_screens/Background.png"
            alt="Background"
        />

        <div class="game-screen" id="fullscreen">

            <div class="overlay-game-over d-none" id="overlay_game_over">
                <div class="game-over-box">
                    <nav class="game-over-nav">
                        <button onclick="resetGame()" class="btn-desktop">
                            Start Game
                        </button>
                        <button onclick="showScreen('start')" class="btn-desktop">
                            Back to Start
                        </button>
                    </nav>
                    <img
                        class="game-over-background"
                        src="img/img/You won, you lost/Game over A.png"
                        alt="You Lost Background"
                    />
                </div>
            </div>

            <div class="overlay-winning d-none" id="overlay_winning">
                <div class="winning-box">
                    <nav class="winning-nav">
                        <button onclick="resetGame()" class="btn-desktop">
                            Start Game
                        </button>
                        <button onclick="showScreen('start')" class="btn-desktop">
                            Back to Start
                        </button>
                    </nav>
                    <img
                        class="wining-background"
                        src="img/img/You won, you lost/You Win A.png"
                        alt="You Win Background"
                    />
                </div>
            </div>

            <div class="side-mobile-controls">
                <div
                    onclick="toggleGamePause()"
                    class="pause-control-box"
                    id="game_pause_box_play"
                >
                    <img
                        class="images-play-nav"
                        id="game_pause_box_img_play"
                        src="icons/pause-icon.png"
                        alt="Pause Game Icon"
                    />
                </div>
            </div>

            <nav class="play-nav">
                <div onclick="showScreen('menu')" class="quit-game-box">
                    <img
                        class="images-play-nav"
                        src="icons/left-arrow.png"
                        alt="exit game icon"
                    />
                </div>

                <div onclick="fullscreen()" class="fullscreen-box">
                    <img
                        id="fullscreen_img"
                        class="images-play-nav"
                        src="icons/maximize-fullscreen.png"
                        alt="fullscreen icon"
                    />
                </div>

                <div onclick="toggleSound()" class="sound-box" id="sound_box_play">
                    <img
                        id="sound_box_img_play"
                        class="images-play-nav"
                        src="icons/volume-off.png"
                        alt="volume icon"
                    />
                </div>
            </nav>
            <canvas
                class="canvas"
                id="canvas"
                width="720"
                height="480"
            ></canvas>
        </div> 
            <nav class="mobile-nav d-none" id="mobile_nav">
                <div class="mobile-left-controls">
                    <div id="btn_left" class="mobile-btn-box">
                        <img src="icons/left-arrow.png" alt="left arrow icon" />
                    </div>
                    <div id="btn_right" class="mobile-btn-box">
                        <img src="icons/right-arrow.png" alt="right arrow icon" />
                    </div>
                </div>

                <div class="mobile-right-controls">
                    <div id="btn_jump" class="mobile-btn-box">
                        <img src="icons/jump-icon.png" alt="jump icon" />
                    </div>
                    <div id="btn_throw" class="mobile-btn-box">
                        <img src="icons/throw-icon.png" alt="throw icon" />
                    </div>
                </div>
            </nav>
    </div> 

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/collect-bottles.class.js"></script>
    <script src="models/collect-coins.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="models/world.class.js"></script>
    <script src="js-section/world-loops.js"></script>
    <script src="js-section/world-collision.js"></script>
    <script src="js-section/world-audios.js"></script>
    <script src="js-section/character-logic.js"></script>
    <script src="js/game.js"></script>
    <script src="script.js"></script>
</body>
</html>
