<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="styles/play-game.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="icons/favicon.png" type="image/x-icon" />

  </head>
  <body onload="startGame()" class="game-body">

    <img class="game-screen-background" src="img/img/9_intro_outro_screens/Background.png" alt="Background" />

    <div class="game-screen" id="fullscreen">
      <div class="overlay-rotate-device" id="overlay_rotate_device">
        <img src="icons/rotate-device.png" alt="rotate phone icon" />
      </div>

      <div class="overlay-game-over" id="overlay_game_over">
        <div class="game-over-box">
          <nav class="game-over-nav">
            <button onclick="resetGame()" title="reset Game" class="btn-desktop">Start Game</button>
            <button title="Start Screen" class="btn-desktop" onclick="navigateTo('index.html')">Back to Start</button>
          </nav>
          <img class="game-over-background" src="img/img/You won, you lost/Game over A.png" alt="You Lost Background" />
        </div>
      </div>

      <div class="overlay-winning" id="overlay_winning">
        <div class="winning-box">
          <nav class="winning-nav">
            <button onclick="resetGame()" title="reset Game" class="btn-desktop">Start Game</button>
            <button title="Start Screen" class="btn-desktop" onclick="navigateTo('index.html')">Back to Start</button>
          </nav>
          <img class="wining-background" src="img/img/You won, you lost/You Win A.png" alt="You Win Background" />
        </div>
      </div>

      <div class="side-mobile-controls">
        <div onclick="toggleGamePause()" class="pause-control-box" id="game_pause_box_play"> <!--Wird die Id Benutzt aktuell?-->
          <img class="images-play-nav" id="game_pause_box_img_play" title="Pause" src="icons/pause-icon.png" alt="Pause Game Icon" />
        </div>
      </div>

      <nav class="play-nav">
        <div onclick="navigateTo('menu.html')" title="Spiel Beenden" class="quit-game-box">
          <img class="images-play-nav" src="icons/button-end.png" alt="exit game icon" />
        </div>

        <div onclick="fullscreen()" class="fullscreen-box">
          <img title="fullscreen on" id="fullscreen_img" class="images-play-nav" src="icons/maximize-fullscreen.png" alt="maximize-fullscreen-Icon" />
        </div>

        <div onclick="toggleSound()" class="sound-box" id="sound_box_play">
          <img class="images-play-nav" id="sound_box_img_play" title="Sound off" src="icons/volume-off.png" alt="volume-off-icon" />
        </div>
      </nav>

      <nav class="mobile-nav" id="mobile_nav">
        <div class="mobile-left-controls">
          <div id="btn_left" class="mobile-btn-box">
            <img src="icons/left-arrow.png" alt="left arrow icon" />
          </div>
          <div id="btn_right" class="mobile-btn-box">
            <img src="icons/right-arrow.png" alt="right arrow icon" />
          </div>
        </div>

        <div class="mobile-right-controls">
          <div id="btn_jump" class="mobile-btn-box">
            <img src="icons/jump-icon.png" alt="jump icon" />
          </div>

          <div id="btn_throw" class="mobile-btn-box">
            <img src="icons/throw-icon.png" alt="throw icon" />
          </div>
        </div>
      </nav>

      <canvas class="canvas" id="canvas" width="720" height="480"> </canvas>
    </div>

    <script type="text/javascript">
      document.addEventListener('DOMContentLoaded', function () {
        if (performance.navigation.type === 1) {
          window.location.href = 'menu.html';
        }
      });
    </script>

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/collect-coins.class.js"></script>
    <script src="models/collect-bottles.class.js"></script>
    <script src="js/game.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="script.js"></script>
    <script src="models/world.class.js"></script>
    <script src="js-section/character-logic.js"></script>
    <script src="js-section/world-audios.js"></script>
    <script src="js-section/world-collision.js"></script>
    <script src="js-section/world-loops.js"></script>
  </body>
</html>
